{% extends "base.html" %}

{% block title %}Request a show | TV Show Tracker{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card">
      <div class="card-body p-4">
        <h1 class="h2">Request a show</h1>
        <p class="text-body-secondary">Can't find a show in the catalog? Tell us what to add, and staff will review it.</p>
        <form method="post">
          {% csrf_token %}
          {% include "partials/_form_fields.html" %}
          <button class="btn btn-primary" type="submit">Send request</button>
          <a class="btn btn-link text-reset" href="{% url 'shows:request_list' %}">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
