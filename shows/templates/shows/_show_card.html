<a class="poster poster-{{ show.genre.name|slugify }}" href="{{ show.get_absolute_url }}" title="{{ show.description }}">
  <span class="poster-genre">{{ show.genre.name }}</span>
  <span class="poster-title">{{ show.title }}</span>
  <span class="poster-meta">{{ show.network }} &middot; {{ show.premiere_year }} &middot; {{ show.episode_count }} ep{{ show.episode_count|pluralize }}</span>
</a>
